name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_generated:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply comparison source-id normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          compare = Path('src/site/php/npazs/content/compare.php')
          s = compare.read_text(encoding='utf-8')
          old = """    $changerItemIdSet = [];
              foreach ($changerIds as $cid) {
                  foreach (array_filter(array_map('trim', explode(',', $cid))) as $c) {
                      if ($c !== 'base') {
                          $changerItemIdSet[$c] = true;
                      }
                  }
              }
          """
          new = """    $changerItemIdSet = [];
              foreach ($changerIds as $cid) {
                  foreach (array_filter(array_map('trim', explode(',', $cid))) as $c) {
                      if ($c === 'base') continue;

                      // modified_by_id хранит внутренний npa_item.id,
                      // not_valid хранит стабильный строковый item_id.
                      $changerItemIdSet[$c] = true;
                      if (ctype_digit($c)) {
                          $stmtChanger = $pdo->prepare(
                              'SELECT item_id FROM npa_item WHERE id = ? LIMIT 1'
                          );
                          $stmtChanger->execute([(int)$c]);
                          $changerItemId = $stmtChanger->fetchColumn();

                          if ($changerItemId) {
                              $changerItemIdSet[(string)$changerItemId] = true;
                          }
                      }
                  }
              }
          """
          if old not in s:
              raise SystemExit('compare target not found')
          compare.write_text(s.replace(old, new, 1), encoding='utf-8')

          tree = Path('src/site/php/npazs/render/tree.php')
          s = tree.read_text(encoding='utf-8')
          old = """            foreach (array_filter(array_map('trim', explode(',', (string)($parentData['modified_by_id'] ?? '')))) as $sourceId) {
                  if ($sourceId !== 'base') {
                      $parentSources[$sourceId] = true;
                  }
              }
          """
          new = """            foreach (array_filter(array_map('trim', explode(',', (string)($parentData['modified_by_id'] ?? '')))) as $sourceId) {
                  if ($sourceId === 'base') continue;

                  // modified_by_id хранит внутренний npa_item.id,
                  // not_valid хранит стабильный строковый item_id.
                  $parentSources[$sourceId] = true;
                  if (ctype_digit($sourceId)) {
                      $stmtSource = $pdo->prepare(
                          'SELECT item_id FROM npa_item WHERE id = ? LIMIT 1'
                      );
                      $stmtSource->execute([(int)$sourceId]);
                      $sourceItemId = $stmtSource->fetchColumn();

                      if ($sourceItemId) {
                          $parentSources[(string)$sourceItemId] = true;
                      }
                  }
              }
          """
          if old not in s:
              raise SystemExit('tree target not found')
          tree.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Rebuild generated snippet
        run: python data/work_tools/build_snippet.py

      - name: Verify generated snippet
        run: python data/work_tools/build_snippet.py --check

      - name: Commit generated changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/php/npazs/content/compare.php src/site/php/npazs/render/tree.php src/site/php/snippet.php
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: normalize comparison source ids"
          git push origin HEAD:main

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m compileall -q src tests
