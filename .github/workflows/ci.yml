name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_generated:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply comparison source-id normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          compare = Path('src/site/php/npazs/content/compare.php')
          s = compare.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?ms)^    \$changerItemIdSet = \[\];\n"
              r"    foreach \(\$changerIds as \$cid\) \{\n"
              r"        foreach \(array_filter\(array_map\('trim', explode\(',', \$cid\)\)\) as \$c\) \{\n"
              r"            if \(\$c !== 'base'\) \{\n"
              r"                \$changerItemIdSet\[\$c\] = true;\n"
              r"            \}\n"
              r"        \}\n"
              r"    \}\n"
          )
          replacement = """    $changerItemIdSet = [];
              foreach ($changerIds as $cid) {
                  foreach (array_filter(array_map('trim', explode(',', $cid))) as $c) {
                      if ($c === 'base') continue;

                      // modified_by_id хранит внутренний npa_item.id,
                      // not_valid хранит стабильный строковый item_id.
                      $changerItemIdSet[$c] = true;
                      if (ctype_digit($c)) {
                          $stmtChanger = $pdo->prepare(
                              'SELECT item_id FROM npa_item WHERE id = ? LIMIT 1'
                          );
                          $stmtChanger->execute([(int)$c]);
                          $changerItemId = $stmtChanger->fetchColumn();

                          if ($changerItemId) {
                              $changerItemIdSet[(string)$changerItemId] = true;
                          }
                      }
                  }
              }
          """
          if len(pattern.findall(s)) != 1:
              raise SystemExit('compare target not found exactly once')
          compare.write_text(pattern.sub(replacement, s, count=1), encoding='utf-8')

          tree = Path('src/site/php/npazs/render/tree.php')
          s = tree.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?ms)^            foreach \(array_filter\(array_map\('trim', explode\(',', \(string\)\(\$parentData\['modified_by_id'\] \?\? ''\)\)\)\) as \$sourceId\) \{\n"
              r"                if \(\$sourceId !== 'base'\) \{\n"
              r"                    \$parentSources\[\$sourceId\] = true;\n"
              r"                \}\n"
              r"            \}\n"
          )
          replacement = """            foreach (array_filter(array_map('trim', explode(',', (string)($parentData['modified_by_id'] ?? '')))) as $sourceId) {
                if ($sourceId === 'base') continue;

                // modified_by_id хранит внутренний npa_item.id,
                // not_valid хранит стабильный строковый item_id.
                $parentSources[$sourceId] = true;
                if (ctype_digit($sourceId)) {
                    $stmtSource = $pdo->prepare(
                        'SELECT item_id FROM npa_item WHERE id = ? LIMIT 1'
                    );
                    $stmtSource->execute([(int)$sourceId]);
                    $sourceItemId = $stmtSource->fetchColumn();

                    if ($sourceItemId) {
                        $parentSources[(string)$sourceItemId] = true;
                    }
                }
            }
          """
          if len(pattern.findall(s)) != 1:
              raise SystemExit('tree target not found exactly once')
          tree.write_text(pattern.sub(replacement, s, count=1), encoding='utf-8')
          PY

      - name: Rebuild generated snippet
        run: python data/work_tools/build_snippet.py

      - name: Verify generated snippet
        run: python data/work_tools/build_snippet.py --check

      - name: Commit generated changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/php/npazs/content/compare.php src/site/php/npazs/render/tree.php src/site/php/snippet.php
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: normalize comparison source ids"
          git push origin HEAD:main

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m compileall -q src tests
