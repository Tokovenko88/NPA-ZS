name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_generated:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize comparison source identifiers
        run: python data/work_tools/normalize_comparison_source.py

      - name: Add selected edition child sources
        run: python data/work_tools/add_selected_child_sources.py

      - name: Rebuild generated snippet
        run: python data/work_tools/build_snippet.py

      - name: Verify generated snippet
        run: python data/work_tools/build_snippet.py --check

      - name: PHP syntax check
        run: |
          php -l src/site/php/npazs/content/compare.php
          php -l src/site/php/npazs/render/tree.php
          php -l src/site/php/snippet.php

      - name: Commit generated changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/php/npazs/content/compare.php src/site/php/npazs/render/tree.php src/site/php/snippet.php
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: restore selected child sources"
          git push origin HEAD:main

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m compileall -q src tests
