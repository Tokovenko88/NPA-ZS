name: Rebuild snippet for comparison fix

on:
  push:
    branches: [fix/comparison-expired-children-body]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild snippet
        run: python data/work_tools/build_snippet.py
      - name: Commit generated snippet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/php/snippet.php
          if git diff --cached --quiet; then
            echo "snippet.php is already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild snippet"
          git push
