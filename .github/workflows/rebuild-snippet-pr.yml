name: Rebuild generated snippet

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild snippet
        run: python data/work_tools/build_snippet.py

      - name: Commit generated snippet to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site/php/snippet.php
          if git diff --cached --quiet; then
            echo "snippet.php is already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild generated snippet"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
